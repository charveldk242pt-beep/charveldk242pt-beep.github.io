<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <meta name="description" content="Graphic design portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー：名前とメニュー -->
  <header class="site-header">
    <a href="#" class="logo" id="site-logo"></a>
    <nav class="nav">
      <a href="#works">Works</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- 作品一覧（タイル）：中身は content/works.json から自動で作られます -->
    <section id="works" class="works">
      <div class="filters" id="filters"></div>
      <ul class="grid" id="grid"></ul>
    </section>

    <!-- 自己紹介：中身は content/site.json から自動で入ります -->
    <section id="about" class="about">
      <h2 class="section-title">About</h2>
      <div class="about-body">
        <p class="about-name"><span id="site-name"></span><span class="about-title" id="site-title"></span></p>
        <p class="about-text" id="site-about"></p>
        <p class="about-skills" id="site-skills"></p>
      </div>
    </section>

    <!-- 連絡先 -->
    <section id="contact" class="contact">
      <h2 class="section-title">Contact</h2>
      <a class="contact-mail" id="site-email" href="#"></a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <!-- 作品の詳細（クリックすると開くウィンドウ） -->
  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="閉じる">&times;</button>

      <div class="modal-media" id="modal-media"></div>

      <div class="modal-info">
        <p class="modal-meta" id="modal-meta"></p>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc" id="modal-desc"></p>
        <dl class="modal-details" id="modal-details"></dl>
      </div>

      <div class="modal-nav">
        <button id="modal-prev" aria-label="前の作品">&larr; Prev</button>
        <button id="modal-next" aria-label="次の作品">Next &rarr;</button>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
